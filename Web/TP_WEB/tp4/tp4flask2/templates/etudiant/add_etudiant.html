<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter un étudiant</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.css">
</head>
<body>
<div class="container mt-3">
    <h2>Ajouter un étudiant</h2>

    <form action="/etudiant/add" method="post">
        <div class="mb-3">
            <label for="nom" class="form-label">Nom de l'étudiant (Requis)</label>
            <input type="text" class="form-control" id="nom" name="nom" placeholder="Ex: Alice" required>
        </div>

        <div class="mb-3">
            <label for="groupe_id" class="form-label">Groupe (Requis)</label>
            <select class="form-select bg-warning" id="groupe_id" name="groupe_id" required>
                <option value="">-- Sélectionner un groupe --</option>
                {% for g in groupes %}
                    <option value="{{ g['id'] }}">{{ g['libelle'] }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Valider l'ajout</button>
        <a href="/etudiant/show" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>

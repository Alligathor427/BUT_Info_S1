{% extends 'layout.html' %}

{% block body %}
<div class="mx-3">
    <h2>Modifier un type de pneu</h2>
    {% for t in types %}
        {% if t.id == id|int %}
        <form action="/type-pneu-velo/edit" method="post">
            <input type="hidden" name="id" value="{{ t.id }}">
            <div class="mb-3">
                <label for="libelleType" class="form-label">Libellé du Type (Requis)</label>
                <input type="text" class="form-control" id="libelleType" name="libelleType" value="{{ t.libelleType }}" required>
            </div>
            <button type="submit" class="btn btn-warning">Valider les modifications</button>
            <a href="/type-pneu-velo/show" class="btn btn-secondary">Annuler</a>
        </form>
        {% endif %}
    {% endfor %}
</div>
{% endblock %}

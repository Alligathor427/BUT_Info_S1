{% extends 'layout.html' %}

{% block body %}
<h2>Liste des Types de Pneus</h2>
    <a href="/type-pneu-velo/add" class="btn btn-success btn-sm">Ajouter</a>

<table class="table table-striped table-bordered mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Libellé du type</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for t in types %}
        <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.libelleType }}</td>
            <td>
            <a href="/type-pneu-velo/edit?id={{ t['id'] }}" class="btn btn-warning btn-sm">Modifier</a>

            <a href="/type-pneu-velo/delete?id={{ t['id'] }}" class="btn btn-danger btn-sm">Supprimer</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

{% extends 'layout.html' %}

{% block body %}
<h2>Filtre des Pneus de Vélo</h2>

<!-- Formulaire du filtre (front-end) -->
<form action="/pneu-velo/filtre" method="get" class="mb-4 p-3 border rounded bg-light">
    <h5>Filtrer par type de pneu :</h5>
    <div class="mb-3">
        {% for t in types %}
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="type_{{ t.id }}" name="types_selected" value="{{ t.id }}">
            <label class="form-check-label" for="type_{{ t.id }}">{{ t.libelleType }}</label>
        </div>
        {% endfor %}
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="nomPneu" class="form-label">Recherche par Nom (Texte)</label>
            <input type="text" class="form-control" id="nomPneu" name="nomPneu" placeholder="Ex: Michelin">
        </div>
        <div class="col-md-6 mb-3">
            <label for="prixPneu" class="form-label">Prix maximum (€)</label>
            <input type="number" step="0.01" class="form-control" id="prixPneu" name="prixPneu" placeholder="Ex: 50">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Filtrer</button>
</form>

<!-- Affichage des cartes Bootstrap (3 par ligne) -->
<div class="row">
    {% for p in pneus %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <img src="{{ url_for('static', filename='images/' + p.image) }}" class="card-img-top p-3" alt="{{ p.nomPneu }}" style="max-height: 200px; object-fit: contain;">
            <div class="card-body">
                <h5 class="card-title">{{ p.nomPneu }}</h5>
                <p class="card-text">
                    <strong>Fabricant :</strong> {{ p.fabricant }}<br>
                    <strong>Dimension :</strong> {{ p.dimension }}<br>
                    <strong>Prix :</strong> {{ p.prixPneu }} €
                </p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
